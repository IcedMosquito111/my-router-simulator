<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>路由模拟系统 - 交互式演示</title>
    <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <style>
        body {
            font-family: sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
        }

        h1 {
            margin-top: 0;
            margin-bottom: 10px;
            font-size: 24px;
        }

        .main-container {
            display: flex;
            flex: 1;
            min-height: 0;
            gap: 20px;
        }

        .left-panel {
            flex: 1 1 50%;
            border: 1px solid #ccc;
            border-radius: 4px;
            overflow: hidden;
            position: relative;
        }

        .right-panel {
            flex: 1 1 50%;
            display: flex;
            flex-direction: column;
            gap: 10px;
            min-width: 0;
        }

        #network {
            width: 100%;
            height: 100%;
        }

        .controls {
            margin-bottom: 10px;
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            align-items: center;
        }

        button {
            padding: 5px 12px;
            cursor: pointer;
            border: 1px solid #888;
            border-radius: 4px;
            background: #f5f5f5;
        }

        button.active-mode {
            background-color: #4CAF50;
            color: white;
            border-color: #388E3C;
        }

        .log {
            flex: 1;
            overflow-y: auto;
            border: 1px solid #ccc;
            padding: 5px;
            background: #f9f9f9;
            font-size: 12px;
            border-radius: 4px;
        }

        .route-info {
            max-height: 300px;
            overflow-y: auto;
            padding: 10px;
            border: 1px solid #ddd;
            background: #fafafa;
            display: none;
            border-radius: 4px;
        }

        .comparison-panel {
            border: 1px solid #d7dce2;
            border-radius: 4px;
            background: #ffffff;
            padding: 12px;
        }

        .comparison-panel h3 {
            margin: 0 0 10px;
            font-size: 15px;
        }

        .comparison-grid {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) 130px;
            gap: 10px;
        }

        .path-result,
        .convergence-result {
            min-width: 0;
            padding: 9px;
            border: 1px solid #e2e6ea;
            border-radius: 4px;
            background: #f8f9fa;
        }

        .result-label {
            margin-bottom: 6px;
            color: #5b6570;
            font-size: 12px;
        }

        .path-value {
            min-height: 32px;
            overflow-wrap: anywhere;
            color: #20262d;
            font-size: 13px;
            line-height: 1.5;
        }

        .path-meta,
        .convergence-state {
            margin-top: 4px;
            color: #6b747d;
            font-size: 11px;
        }

        .convergence-value {
            color: #20262d;
            font-size: 22px;
            line-height: 32px;
        }

        .convergence-value.success {
            color: #238636;
        }

        .convergence-value.failure,
        .path-meta.failure {
            color: #c62828;
        }

        @media (max-width: 900px) {
            .main-container {
                flex-direction: column;
            }

            .left-panel {
                min-height: 48vh;
            }

            .comparison-grid {
                grid-template-columns: 1fr;
            }
        }

        table {
            border-collapse: collapse;
            width: 100%;
            font-size: 12px;
        }

        th,
        td {
            border: 1px solid #ddd;
            padding: 4px;
            text-align: left;
        }

        th {
            background: #f0f0f0;
        }

        .protocol-tip {
            font-size: 12px;
            color: #555;
            margin-left: 10px;
        }

        .controls select,
        .controls input[type="text"] {
            padding: 6px 8px;
            font-size: 13px;
            border: 1px solid #bbb;
            border-radius: 4px;
        }

        .controls input[type="text"] {
            width: 210px;
        }

        .status-tip {
            font-size: 12px;
            color: #555;
            margin-left: 10px;
        }
    </style>
</head>

<body>
    <h1>路由模拟系统 - 交互式演示</h1>
    <div class="controls">
        <button id="btn-fault-inject" onclick="setMode('fault-inject')">故障注入</button>
        <button id="btn-fault-recover" onclick="setMode('fault-recover')">故障恢复</button>
        <span style="width:20px;"></span>
        <button id="btn-select-src" onclick="setMode('select-src')">选择源节点</button>
        <button id="btn-select-dst" onclick="setMode('select-dst')">选择目的节点</button>
        <label class="protocol-tip">协议
            <select id="protocol-select" onchange="updateSelectionTip()">
                <option value="IPv4">IPv4</option>
                <option value="IPv6">IPv6</option>
            </select>
        </label>
        <input id="dst-override" type="text" placeholder="目的地址（选填，如 2001:db8:ffff::29）"
               onchange="updateSelectionTip()" />
        <button id="btn-send-packet" onclick="sendPacket()">发送分组</button>
        <button id="btn-reset-selection" onclick="resetSelection()">重置选择</button>
        <span class="status-tip" id="status-tip">就绪 - 请点击按钮选择操作</span>
    </div>
    <div class="main-container">
        <div class="left-panel">
            <div id="network"></div>
        </div>
        <div class="right-panel">
            <div class="comparison-panel">
                <h3>故障路由对比</h3>
                <div class="comparison-grid">
                    <div class="path-result">
                        <div class="result-label">故障前路径</div>
                        <div class="path-value" id="before-path">尚未发送分组</div>
                        <div class="path-meta" id="before-path-meta">--</div>
                    </div>
                    <div class="path-result">
                        <div class="result-label">故障后路径</div>
                        <div class="path-value" id="after-path">等待故障注入</div>
                        <div class="path-meta" id="after-path-meta">--</div>
                    </div>
                    <div class="convergence-result">
                        <div class="result-label">收敛耗时</div>
                        <div class="convergence-value" id="convergence-time">--</div>
                        <div class="convergence-state" id="convergence-state">目标 &le; 2000 ms</div>
                    </div>
                </div>
            </div>
            <h3 style="margin: 0;">实时日志</h3>
            <div class="log" id="log"></div>
            <div class="route-info" id="route-info"></div>
        </div>
    </div>

    <script>
        let ws;
        let nodesDataset, edgesDataset, network;
        let currentMode = null;
        let selectedSrc = null;
        let selectedDst = null;
        let firstLoad = true;
        let lastPacketRequest = null;
        let lastCompletedPacket = null;
        let faultComparison = null;
        let awaitingPostFaultPacket = false;
        let packetAnimationId = 0;

        // 固定节点尺寸：直径 18px，半径 9
        const NODE_DIAMETER = 18;
        const NODE_RADIUS = NODE_DIAMETER / 2;
        const PACKET_NODE_ID = '__packet_animation__';
        const HOP_ANIMATION_MS = 550;

        function initNetwork() {
            nodesDataset = new vis.DataSet([]);
            edgesDataset = new vis.DataSet([]);
            const container = document.getElementById('network');
            const data = { nodes: nodesDataset, edges: edgesDataset };
            const options = {
                physics: { enabled: false },
                interaction: { hover: true },
                nodes: {
                    shape: 'circle',
                    size: NODE_RADIUS,
                    widthConstraint: { minimum: NODE_DIAMETER, maximum: NODE_DIAMETER },
                    heightConstraint: { minimum: NODE_DIAMETER, maximum: NODE_DIAMETER },
                    scaling: {
                        label: { enabled: false }
                    },
                    font: { size: 8, color: '#ffffff', face: 'arial', strokeWidth: 0, background: 'none' },
                    borderWidth: 1,
                    shadow: false,
                    color: {
                        background: '#4CAF50',
                        border: '#2E7D32'
                    }
                },
                edges: { width: 2, smooth: { enabled: false } }
            };
            network = new vis.Network(container, data, options);

            network.on('click', function (params) {
                if (params.nodes.includes(PACKET_NODE_ID)) {
                    return;
                }
                if (currentMode === 'fault-inject') {
                    if (params.nodes.length > 0) {
                        const nodeId = params.nodes[0];
                        beginFaultComparison('节点', nodeId);
                        nodesDataset.update({ id: nodeId, status: 'down', color: { background: '#f44336', border: '#B71C1C' } });
                        sendCommand('inject_fault', { type: 'node', id: nodeId });
                        setMode(null);
                    } else if (params.edges.length > 0) {
                        const edgeId = params.edges[0];
                        const edge = edgesDataset.get(edgeId);
                        beginFaultComparison('链路', `${edge.from}-${edge.to}`);
                        edgesDataset.update({ id: edgeId, status: 'down', color: { color: '#f44336', highlight: '#f44336' }, width: 4 });
                        sendCommand('inject_fault', { type: 'link', source: edge.from, target: edge.to });
                        setMode(null);
                    }
                } else if (currentMode === 'fault-recover') {
                    if (params.nodes.length > 0) {
                        const nodeId = params.nodes[0];
                        nodesDataset.update({ id: nodeId, status: 'up', color: { background: '#4CAF50', border: '#2E7D32' } });
                        sendCommand('recover_fault', { type: 'node', id: nodeId });
                        setMode(null);
                    } else if (params.edges.length > 0) {
                        const edgeId = params.edges[0];
                        const edge = edgesDataset.get(edgeId);
                        edgesDataset.update({ id: edgeId, status: 'up', color: { color: '#848484', highlight: '#848484' }, width: 2 });
                        sendCommand('recover_fault', { type: 'link', source: edge.from, target: edge.to });
                        setMode(null);
                    }
                } else if (currentMode === 'select-src' && params.nodes.length > 0) {
                    selectedSrc = params.nodes[0];
                    setMode(null);
                    updateSelectionColors();
                    updateSelectionTip();
                } else if (currentMode === 'select-dst' && params.nodes.length > 0) {
                    selectedDst = params.nodes[0];
                    setMode(null);
                    updateSelectionColors();
                    updateSelectionTip();
                } else if (params.nodes.length > 0) {
                    requestRoutingTable(params.nodes[0]);
                }
            });

            network.on('dragEnd', function (params) {
                if (params.nodes.length > 0) {
                    const nodeId = params.nodes[0];
                    const position = network.getPosition(nodeId);
                    nodesDataset.update({ id: nodeId, x: position.x, y: position.y });
                }
            });
        }

        function setMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.controls button').forEach(btn => btn.classList.remove('active-mode'));
            const tip = document.getElementById('status-tip');
            if (mode === 'fault-inject') {
                tip.textContent = '请点击一个节点或链路以注入故障';
                document.getElementById('btn-fault-inject').classList.add('active-mode');
            } else if (mode === 'fault-recover') {
                tip.textContent = '请点击一个节点或链路以恢复';
                document.getElementById('btn-fault-recover').classList.add('active-mode');
            } else if (mode === 'select-src') {
                tip.textContent = '请点击选择源节点';
                document.getElementById('btn-select-src').classList.add('active-mode');
            } else if (mode === 'select-dst') {
                tip.textContent = '请点击选择目的节点';
                document.getElementById('btn-select-dst').classList.add('active-mode');
            } else {
                updateSelectionTip();
            }
        }

        function updateStatusTip(text) {
            document.getElementById('status-tip').textContent = text;
        }

        // ---------- 协议族与地址解析 ----------
        function currentProtocol() {
            const select = document.getElementById('protocol-select');
            return select && select.value === 'IPv6' ? 'IPv6' : 'IPv4';
        }

        function setProtocol(value) {
            const select = document.getElementById('protocol-select');
            if (select && select.value !== value) {
                select.value = value;
            }
        }

        function stripMask(address) {
            return (address || '').split('/')[0];
        }

        // 目的地址解析优先级：手输地址 > 所选目的节点在当前协议族下的回环地址
        function resolveDestinationAddress(protocol, override) {
            if (override) {
                return override;
            }
            if (!selectedDst) {
                return null;
            }
            const node = nodesDataset.get(selectedDst);
            if (!node) {
                return null;
            }
            return stripMask(protocol === 'IPv6' ? node.loopbackIpv6 : node.loopbackIpv4);
        }

        function describeNode(nodeId) {
            if (!nodeId) {
                return '未选择';
            }
            const node = nodesDataset.get(nodeId);
            const address = node
                ? stripMask(currentProtocol() === 'IPv6' ? node.loopbackIpv6 : node.loopbackIpv4)
                : '';
            return address ? `${nodeId} (${address})` : nodeId;
        }

        function updateSelectionTip() {
            const override = document.getElementById('dst-override');
            const manual = override ? override.value.trim() : '';
            const target = manual ? `${manual}（手输地址）` : describeNode(selectedDst);
            updateStatusTip(
                `就绪 - 源节点: ${describeNode(selectedSrc)}，目的节点: ${target} · ${currentProtocol()}`
            );
        }

        function resetSelection() {
            selectedSrc = null;
            selectedDst = null;
            const override = document.getElementById('dst-override');
            if (override) {
                override.value = '';
            }
            updateSelectionColors();
            updateStatusTip('已重置源/目的节点选择与手输地址');
        }

        function updateSelectionColors() {
            nodesDataset.get().forEach(node => {
                const isUp = node.status === 'up';
                nodesDataset.update({
                    id: node.id,
                    color: {
                        background: isUp ? '#4CAF50' : '#f44336',
                        border: isUp ? '#2E7D32' : '#B71C1C'
                    }
                });
            });
            if (selectedSrc) {
                nodesDataset.update({ id: selectedSrc, color: { background: '#FF9800', border: '#F57C00' } });
            }
            if (selectedDst) {
                nodesDataset.update({ id: selectedDst, color: { background: '#FF9800', border: '#F57C00' } });
            }
        }

        function updateTopology(snapshot) {
            // 保存现有节点位置
            const existingPositions = {};
            nodesDataset.get().forEach(node => {
                existingPositions[node.id] = { x: node.x, y: node.y };
            });

            // 完全重建
            nodesDataset.clear();
            edgesDataset.clear();

            const totalNodes = snapshot.nodes.length;
            const centerX = 400;
            const centerY = 300;
            const radius = Math.min(centerX, centerY) * 0.95;  // 增大半径，使分布更开

            snapshot.nodes.forEach((node, index) => {
                let x, y;
                if (existingPositions[node.id]) {
                    x = existingPositions[node.id].x;
                    y = existingPositions[node.id].y;
                } else {
                    const angle = (index / totalNodes) * 2 * Math.PI;
                    x = centerX + radius * Math.cos(angle);
                    y = centerY + radius * Math.sin(angle);
                }
                nodesDataset.add({
                    id: node.id,
                    label: node.id,
                    status: node.status,
                    loopbackIpv4: node.loopback_ipv4 || '',
                    loopbackIpv6: node.loopback_ipv6 || '',
                    ipv6Interfaces: node.ipv6_interfaces || [],
                    size: NODE_RADIUS,
                    widthConstraint: { minimum: NODE_DIAMETER, maximum: NODE_DIAMETER },
                    heightConstraint: { minimum: NODE_DIAMETER, maximum: NODE_DIAMETER },
                    x: x,
                    y: y,
                    color: {
                        background: node.status === 'up' ? '#4CAF50' : '#f44336',
                        border: node.status === 'up' ? '#2E7D32' : '#B71C1C'
                    }
                });
            });

            snapshot.links.forEach(link => {
                edgesDataset.add({
                    id: `${link.source}-${link.target}`,
                    from: link.source,
                    to: link.target,
                    status: link.status,
                    color: {
                        color: link.status === 'up' ? '#848484' : '#f44336',
                        highlight: link.status === 'up' ? '#848484' : '#f44336'
                    },
                    width: link.status === 'up' ? 2 : 4
                });
            });

            updateSelectionColors();

            if (firstLoad) {
                firstLoad = false;
                setTimeout(() => {
                    network.fit({ animation: false });
                    const currentScale = network.getScale();
                    network.moveTo({ scale: currentScale * 1.1 });  // 放大 1.3 倍
                }, 100);
            }
        }

        function sendCommand(action, params) {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ action, params }));
            } else {
                addLog('error', 'WebSocket 未连接');
            }
        }

        function sendPacket() {
            const overrideInput = document.getElementById('dst-override');
            const override = overrideInput ? overrideInput.value.trim() : '';

            if (!selectedSrc) {
                addLog('error', '请先选择源节点');
                return;
            }
            if (!selectedDst && !override) {
                addLog('error', '请先选择目的节点，或在输入框中直接填写目的地址');
                return;
            }

            let protocol = currentProtocol();
            // 手输地址带冒号说明是 IPv6：自动纠正协议族，避免被后端"协议与地址版本不一致"拒绝
            if (override && override.includes(':') && protocol !== 'IPv6') {
                setProtocol('IPv6');
                protocol = 'IPv6';
                addLog('info', '检测到 IPv6 目的地址，已自动切换协议为 IPv6');
            }

            const dstIp = resolveDestinationAddress(protocol, override);
            if (!dstIp) {
                addLog('error', `目的节点 ${selectedDst} 没有配置 ${protocol} 地址`);
                return;
            }

            lastPacketRequest = {
                src_node: selectedSrc,
                dst_node: selectedDst,
                dst_ip: dstIp,
                protocol: protocol
            };
            sendCommand('send_packet', { src_node: selectedSrc, dst_ip: dstIp, protocol: protocol });
            updateStatusTip(`分组已从 ${selectedSrc} 发往 ${selectedDst || dstIp} · ${protocol} · ${dstIp}`);
        }

        function beginFaultComparison(type, target) {
            cancelPacketAnimation();
            const beforePath = document.getElementById('before-path');
            const beforeMeta = document.getElementById('before-path-meta');

            faultComparison = {
                request: lastCompletedPacket ? { ...lastCompletedPacket.request } : null,
                before: lastCompletedPacket ? [...lastCompletedPacket.path] : null,
                fault: `${type} ${target}`
            };
            awaitingPostFaultPacket = false;

            if (faultComparison.before) {
                beforePath.textContent = formatPath(faultComparison.before);
                beforeMeta.textContent = `${faultComparison.before.length - 1} 跳`;
            } else {
                beforePath.textContent = '无基准路径';
                beforeMeta.textContent = '请先发送一次分组';
            }
            beforeMeta.className = 'path-meta';

            document.getElementById('after-path').textContent = '正在重新计算路由...';
            const afterMeta = document.getElementById('after-path-meta');
            afterMeta.textContent = faultComparison.fault;
            afterMeta.className = 'path-meta';
            const convergenceTime = document.getElementById('convergence-time');
            convergenceTime.textContent = '--';
            convergenceTime.className = 'convergence-value';
            document.getElementById('convergence-state').textContent = '计算中';
        }

        function updateConvergence(convergenceMs) {
            const convergenceTime = document.getElementById('convergence-time');
            const withinTarget = convergenceMs <= 2000;
            convergenceTime.textContent = `${Number(convergenceMs).toFixed(2)} ms`;
            convergenceTime.className = `convergence-value ${withinTarget ? 'success' : 'failure'}`;
            document.getElementById('convergence-state').textContent = withinTarget ? '满足 2 秒指标' : '超过 2 秒指标';
        }

        function updateBaseline(packet) {
            if (packet.status === 'delivered') {
                lastCompletedPacket = {
                    request: { ...lastPacketRequest },
                    path: [...packet.path],
                    status: packet.status
                };
            } else {
                lastCompletedPacket = null;
            }
            document.getElementById('before-path').textContent = formatPath(packet.path);
            const meta = document.getElementById('before-path-meta');
            meta.textContent = `${Math.max(0, packet.path.length - 1)} 跳 · ${packet.protocol || 'IPv4'} · ${formatPacketStatus(packet.status)}`;
            meta.className = `path-meta${packet.status === 'delivered' ? '' : ' failure'}`;
        }

        function updatePostFaultPath(packet) {
            const meta = document.getElementById('after-path-meta');
            document.getElementById('after-path').textContent = packet.path.length ? formatPath(packet.path) : '无可用路径';
            meta.textContent = `${Math.max(0, packet.path.length - 1)} 跳 · ${packet.protocol || 'IPv4'} · ${formatPacketStatus(packet.status)}`;
            meta.className = `path-meta${packet.status === 'delivered' ? '' : ' failure'}`;
            awaitingPostFaultPacket = false;
        }

        function markPostFaultUnavailable(message) {
            document.getElementById('after-path').textContent = '不可达';
            const meta = document.getElementById('after-path-meta');
            meta.textContent = message;
            meta.className = 'path-meta failure';
            awaitingPostFaultPacket = false;
        }

        function formatPath(path) {
            return path && path.length ? path.join(' → ') : '无可用路径';
        }

        function formatPacketStatus(status) {
            return status === 'delivered' ? '已送达' : '已丢弃';
        }

        // 路由表更新日志聚合：一次故障注入会推送 N 条更新，
        // 逐条打印会把日志面板刷屏，因此合并为一条汇总日志。
        let pendingRouteUpdates = new Set();
        let routeUpdateTimer = null;

        function noteRouteTableUpdate(nodeId) {
            pendingRouteUpdates.add(nodeId);
            if (routeUpdateTimer) {
                return;
            }
            routeUpdateTimer = setTimeout(() => {
                const count = pendingRouteUpdates.size;
                pendingRouteUpdates.clear();
                routeUpdateTimer = null;
                addLog('info', `路由表收敛：${count} 个节点已更新`);
            }, 300);
        }

        function requestRoutingTable(nodeId) {
            sendCommand('get_routing_table', { node_id: nodeId });
        }

        function displayRoutingTable(nodeId, routes) {
            const infoDiv = document.getElementById('route-info');
            const ipv6Count = routes.filter(route => route.destination.includes(':')).length;
            const ipv4Count = routes.length - ipv6Count;
            let html = `<h3>节点 ${nodeId} 路由表（IPv4 ${ipv4Count} 条 / IPv6 ${ipv6Count} 条）</h3>`;
            html += `<table><tr><th>目的网络</th><th>下一跳</th><th>度量值</th><th>接口</th><th>协议</th></tr>`;
            routes.forEach(route => {
                html += `<tr><td>${route.destination}</td><td>${route.next_hop}</td><td>${route.metric}</td><td>${route.interface}</td><td>${route.protocol}</td></tr>`;
            });
            html += '</table>';
            infoDiv.innerHTML = html;
            infoDiv.style.display = 'block';
        }

        function addLog(level, message) {
            const logDiv = document.getElementById('log');
            const entry = document.createElement('div');
            const time = new Date().toLocaleTimeString();
            entry.textContent = `[${time}] [${level}] ${message}`;
            logDiv.appendChild(entry);
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        // 后端地址自适应：由页面自身地址推导，避免写死 localhost（换机器/局域网演示都会失败）
        function resolveWebSocketUrl() {
            if (window.location.protocol === 'file:') {
                return 'ws://localhost:8000/ws';  // 直接用 file:// 打开时的兜底
            }
            const scheme = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            return `${scheme}//${window.location.host}/ws`;
        }

        let reconnectDelay = 1000;
        let reconnectTimer = null;

        function scheduleReconnect() {
            if (reconnectTimer) {
                return;
            }
            reconnectTimer = setTimeout(() => {
                reconnectTimer = null;
                connect();
            }, reconnectDelay);
            addLog('warning', `将在 ${(reconnectDelay / 1000).toFixed(1)} 秒后重连`);
            reconnectDelay = Math.min(reconnectDelay * 2, 15000);
        }

        function connect() {
            if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) {
                return;  // 已有连接，避免重复建立
            }
            ws = new WebSocket(resolveWebSocketUrl());
            ws.onopen = () => {
                reconnectDelay = 1000;
                addLog('info', 'WebSocket 连接成功');
            };
            ws.onmessage = (event) => {
                const msg = JSON.parse(event.data);
                switch (msg.type) {
                    case 'topology_snapshot':
                    case 'topology_update':
                        updateTopology(msg.data);
                        break;
                    case 'routing_table_update':
                        noteRouteTableUpdate(msg.data.node_id);
                        const infoDiv = document.getElementById('route-info');
                        if (infoDiv.style.display !== 'none' && infoDiv.innerHTML.includes(msg.data.node_id)) {
                            requestRoutingTable(msg.data.node_id);
                        }
                        break;
                    case 'log':
                        addLog(msg.data.level, msg.data.message);
                        break;
                    case 'packet_forwarded':
                        addLog('info', `收到分组转发结果：${msg.data.src} -> ${msg.data.dst}，开始逐跳演示`);
                        if (awaitingPostFaultPacket) {
                            updatePostFaultPath(msg.data);
                        } else if (lastPacketRequest) {
                            updateBaseline(msg.data);
                        }
                        animatePacketPath(msg.data);
                        break;
                    case 'command_response':
                        addLog(msg.data.success ? 'info' : 'error', msg.data.message);
                        if (msg.data.success && msg.data.data && msg.data.data.routes) {
                            displayRoutingTable(msg.data.data.node_id, msg.data.data.routes);
                        }
                        if (msg.action === 'inject_fault' && msg.data.success && msg.data.data && msg.data.data.operation === 'fault') {
                            updateConvergence(msg.data.data.convergence_ms);
                            if (faultComparison && faultComparison.request) {
                                awaitingPostFaultPacket = true;
                                const request = faultComparison.request;
                                sendCommand('send_packet', {
                                    src_node: request.src_node,
                                    dst_ip: request.dst_ip,
                                    protocol: request.protocol
                                });
                            } else {
                                document.getElementById('after-path').textContent = '未执行路径对比';
                                document.getElementById('after-path-meta').textContent = '缺少故障前基准路径';
                            }
                        } else if (msg.action === 'send_packet' && !msg.data.success && awaitingPostFaultPacket) {
                            markPostFaultUnavailable(msg.data.message);
                        } else if (msg.action === 'inject_fault' && !msg.data.success && faultComparison) {
                            document.getElementById('convergence-state').textContent = '故障注入失败';
                        }
                        break;
                    case 'error':
                        addLog('error', msg.data.message);
                        break;
                }
            };
            ws.onerror = () => addLog('error', 'WebSocket 错误');
            ws.onclose = () => {
                addLog('warning', 'WebSocket 连接关闭');
                scheduleReconnect();  // 后端重启/网络抖动时自动恢复，无需手动刷新页面
            };
        }

        function resetPathHighlight() {
            updateSelectionColors();
            edgesDataset.get().forEach(edge => {
                const isUp = edge.status === 'up';
                edgesDataset.update({
                    id: edge.id,
                    color: { color: isUp ? '#848484' : '#f44336', highlight: isUp ? '#848484' : '#f44336' },
                    width: isUp ? 2 : 4
                });
            });
        }

        function getPathEdgeId(source, target) {
            const forwardId = `${source}-${target}`;
            if (edgesDataset.get(forwardId)) {
                return forwardId;
            }
            const reverseId = `${target}-${source}`;
            return edgesDataset.get(reverseId) ? reverseId : null;
        }

        function cancelPacketAnimation() {
            packetAnimationId += 1;
            if (nodesDataset && nodesDataset.get(PACKET_NODE_ID)) {
                nodesDataset.remove(PACKET_NODE_ID);
            }
        }

        function movePacketMarker(from, to, animationId) {
            return new Promise(resolve => {
                const startedAt = performance.now();

                function renderFrame(now) {
                    if (animationId !== packetAnimationId || !nodesDataset.get(PACKET_NODE_ID)) {
                        resolve(false);
                        return;
                    }

                    const progress = Math.min((now - startedAt) / HOP_ANIMATION_MS, 1);
                    const eased = 0.5 - Math.cos(progress * Math.PI) / 2;
                    nodesDataset.update({
                        id: PACKET_NODE_ID,
                        x: from.x + (to.x - from.x) * eased,
                        y: from.y + (to.y - from.y) * eased
                    });

                    if (progress < 1) {
                        requestAnimationFrame(renderFrame);
                    } else {
                        resolve(true);
                    }
                }

                requestAnimationFrame(renderFrame);
            });
        }

        async function animatePacketPath(packet) {
            cancelPacketAnimation();
            const animationId = packetAnimationId;
            const path = packet.path || [];
            resetPathHighlight();

            if (!path.length || !nodesDataset.get(path[0])) {
                updateStatusTip('分组没有可演示的转发路径');
                return;
            }

            const startPosition = network.getPosition(path[0]);
            nodesDataset.add({
                id: PACKET_NODE_ID,
                label: '',
                shape: 'dot',
                size: 7,
                x: startPosition.x,
                y: startPosition.y,
                fixed: true,
                physics: false,
                borderWidth: 3,
                color: { background: '#ffffff', border: '#1976D2' },
                shadow: { enabled: true, color: 'rgba(0, 0, 0, 0.25)', size: 7, x: 0, y: 2 },
                chosen: false
            });
            nodesDataset.update({
                id: path[0],
                color: { background: '#FF9800', border: '#F57C00' }
            });

            const totalHops = Math.max(0, path.length - 1);
            if (totalHops === 0) {
                updateStatusTip(`分组停留在 ${path[0]}，状态：${formatPacketStatus(packet.status)}`);
            }

            for (let index = 0; index < totalHops; index++) {
                if (animationId !== packetAnimationId) {
                    return;
                }

                const source = path[index];
                const target = path[index + 1];
                if (!nodesDataset.get(source) || !nodesDataset.get(target)) {
                    cancelPacketAnimation();
                    updateStatusTip('拓扑已变化，逐跳动画已停止');
                    return;
                }

                const edgeId = getPathEdgeId(source, target);
                if (edgeId) {
                    edgesDataset.update({
                        id: edgeId,
                        color: { color: '#1976D2', highlight: '#0D47A1' },
                        width: 4
                    });
                }
                updateStatusTip(`分组转发：${source} → ${target}（第 ${index + 1}/${totalHops} 跳）`);

                const moved = await movePacketMarker(
                    network.getPosition(source),
                    network.getPosition(target),
                    animationId
                );
                if (!moved) {
                    return;
                }

                if (edgeId) {
                    edgesDataset.update({
                        id: edgeId,
                        color: { color: '#FF9800', highlight: '#FF5722' },
                        width: 4
                    });
                }
                nodesDataset.update({
                    id: target,
                    color: { background: '#FF9800', border: '#F57C00' }
                });
            }

            if (animationId !== packetAnimationId) {
                return;
            }
            nodesDataset.remove(PACKET_NODE_ID);
            const destination = path[path.length - 1];
            const dropReason = packet.drop_reason ? `，原因：${packet.drop_reason}` : '';
            updateStatusTip(`分组到达 ${destination}，状态：${formatPacketStatus(packet.status)}${dropReason}`);
            addLog(
                packet.status === 'delivered' ? 'info' : 'warning',
                `逐跳演示完成，共 ${totalHops} 跳，状态：${formatPacketStatus(packet.status)}${dropReason}`
            );

            setTimeout(() => {
                if (animationId === packetAnimationId) {
                    sendCommand('get_topology', {});
                }
            }, 3000);
        }

        window.onload = () => {
            initNetwork();
            connect();
        };
    </script>
</body>
